<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Study Planner</title>
  </head>
  <body>
    <div class="container">
      <header class="header box">
        <div class="logo">Studysync</div>
        <div class="search">
          <input type="text" placeholder="Search tasks...." />
        </div>
        <div class="right-header">
          <div class="date-time">
            <span>29 July 2026</span>
            <span>8:20 pm</span>
          </div>
          <button><i class="fa-solid fa-bell"></i></button>
          <div class="profile">
            <img src="assets/image/profile.png" alt="profile picture" />
          </div>
        </div>
      </header>
      <aside class="sidebar box">
        <nav>
          <ul>
            <li>
              <i class="fa-solid fa-house"></i>
              <span> Dashboard </span>
            </li>
            <li>
              <i class="fa-solid fa-book"></i>
              <span> Planner </span>
            </li>
            <li>
              <i class="fa-solid fa-calendar-days"></i> <span> Calender </span>
            </li>
            <li><i class="fa-solid fa-note-sticky"></i><span> Notes </span></li>
            <li>
              <i class="fa-solid fa-chart-simple"></i><span> Stats </span>
            </li>
            <li><i class="fa-solid fa-gear"></i><span> Settings </span></li>
          </ul>
        </nav>
      </aside>
      <main class="dashboard box">
        <section class="overview">
          <h2>Overview</h2>
          <div class="overview-header">
            <h3 class="greetings">Good Evening, Ankit</h3>
          </div>
          <ul class="dailyoverview">
            <li>
              <span class="label">Today's Goal: </span>
              <span class="value">4 hours</span>
            </li>

            <li>
              <span class="label">Completed Tasks: </span>
              <span class="value">5/8</span>
            </li>
            <li>
              <span class="label">Study Streak: </span>
              <span class="value">🔥 12 days</span>
            </li>
          </ul>
        </section>
        <section class="todays-task">
          <h2>Today's Tasks</h2>
        </section>
        <section class="pomodoro-timer">
          <h2>Pomodoro Timer</h2>
        </section>
        <section class="progress">
          <h2>Progress</h2>
        </section>
        <section class="quick-notes">
          <h2>Quick Notes</h2>
        </section>
      </main>
    </div>
    <script
      src="https://kit.fontawesome.com/f65cc94aa1.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
